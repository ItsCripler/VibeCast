[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecast-backend"
version = "0.1.0"
description = "Jamendo-only AI-assisted music discovery platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "pgvector>=0.3,<1",
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "PyJWT[crypto]>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "authlib>=1.3,<2",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.2,<3",
  "numpy>=1.26,<3",
  "sentence-transformers>=3.0,<6",
]

[project.optional-dependencies]
analysis = ["essentia>=2.1b6.dev1110"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI uses Depends(...) in function signatures; dense API responses may exceed 100 columns.
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
